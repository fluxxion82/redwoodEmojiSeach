android {
  namespace 'com.example.redwood.emojisearch.android.composeui'

  defaultConfig {
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  buildFeatures {
    // Needed to pass application ID to UIAutomator tests.
    buildConfig = true
  }
}

dependencies {
  implementation libs.coil.network.okhttp
  implementation libs.okhttp
  implementation libs.google.material
  implementation libs.kotlinx.coroutines.android
  implementation project(":launcher")
  implementation project(":presenter-treehouse")
  implementation project(":schema:protocol-host")
  implementation project(":shared-composeui")
  implementation libs.androidx.activity.compose
  implementation libs.androidx.appCompat
  implementation libs.androidx.core
  implementation libs.jetbrains.compose.material
  implementation libs.jetbrains.compose.ui
  debugImplementation libs.jetbrains.compose.ui.tooling
  implementation libs.redwood.layout.composeui
  implementation libs.redwood.lazylayout.composeui
  implementation libs.redwood.treehouse.host
  implementation libs.redwood.treehouse.host.composeui
  implementation libs.redwood.widget.compose
  implementation libs.okio.assetfilesystem
//
//  androidTestImplementation libs.androidx.test.runner
