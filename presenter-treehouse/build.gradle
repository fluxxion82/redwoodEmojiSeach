apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'app.cash.zipline'

//redwoodBuild {
//  ziplineApplication('emoji-search')
//}

kotlin {
  iosArm64()
  iosX64()
  iosSimulatorArm64()

  jvm()

  js {
    // The name of the JS module which needs to be unique within the repo.
    moduleName = 'emoji-search-presenter-treehouse'
    browser()
    binaries.executable()
  }

  sourceSets {
    commonMain {
      dependencies {
        api libs.okio
        api libs.redwood.treehouse
      }
    }

    jsMain {
      dependencies {
        api libs.redwood.treehouse.guest
        api project(":presenter")
        implementation project(":schema:protocol-guest")
      }
    }
  }
}

zipline {
  mainFunction = 'com.example.redwood.emojisearch.treehouse.preparePresenters'
}
